<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My American Friends make me crazy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">
  <h1 class="titlebar">My American Friends make me crazy</h1>
  <div class="panel">

    <section class="group" aria-labelledby="h-temp">
      <h2 id="h-temp">Temperatur</h2>
      <div class="row">
        <div class="field">
          <label for="fahrenheit">Fahrenheit (°F)</label>
          <input type="text" id="fahrenheit" class="digits" placeholder="Fahrenheit" inputmode="decimal">
        </div>
        <span class="arrow" aria-hidden="true">⇄</span>
        <div class="field">
          <label for="celsius">Celsius (°C)</label>
          <input type="text" id="celsius" class="digits" placeholder="Celsius" inputmode="decimal">
        </div>
      </div>
      <p class="error" id="err-temp" aria-live="polite"></p>
    </section>

    <section class="group" aria-labelledby="h-height">
      <h2 id="h-height">Körpergröße</h2>
      <div class="row">
        <div class="field">
          <label for="feetInches">Feet / Inches</label>
          <input type="text" id="feetInches" class="digits" placeholder="z. B. 5'9&quot;" aria-describedby="hint-fi">
        </div>
        <span class="arrow" aria-hidden="true">⇄</span>
        <div class="field">
          <label for="cm">cm oder m/cm</label>
          <input type="text" id="cm" class="digits" placeholder="cm oder m/cm" inputmode="decimal" aria-describedby="hint-fi">
        </div>
      </div>
      <p class="hint" id="hint-fi">Formate: 5'9", 5' 9, 5 9, 5,9 · cm: 175 oder in Metern 1,75 (Werte unter 10 gelten als Meter)</p>
      <p class="error" id="err-height" aria-live="polite"></p>
    </section>

    <section class="group" aria-labelledby="h-dist">
      <h2 id="h-dist">Entfernung</h2>
      <div class="row">
        <div class="field">
          <label for="miles">Miles</label>
          <input type="text" id="miles" class="digits" placeholder="Meilen" inputmode="decimal">
        </div>
        <span class="arrow" aria-hidden="true">⇄</span>
        <div class="field">
          <label for="km">Kilometer (km)</label>
          <input type="text" id="km" class="digits" placeholder="km" inputmode="decimal">
        </div>
      </div>
      <p class="error" id="err-dist" aria-live="polite"></p>
    </section>

    <section class="group" aria-labelledby="h-weight">
      <h2 id="h-weight">Gewicht</h2>
      <div class="row">
        <div class="field">
          <label for="lbs">Pounds (lbs)</label>
          <input type="text" id="lbs" class="digits" placeholder="lbs" inputmode="decimal">
        </div>
        <span class="arrow" aria-hidden="true">⇄</span>
        <div class="field">
          <label for="kg">Kilogramm (kg)</label>
          <input type="text" id="kg" class="digits" placeholder="kg" inputmode="decimal">
        </div>
      </div>
      <p class="error" id="err-weight" aria-live="polite"></p>
    </section>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
