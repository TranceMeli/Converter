<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My American Friends make me crazy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic/index.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="titlebar">My American Friends make me crazy</div>
  <div class="panel">

    <div class="row">
      <div class="field">
        <label for="fahrenheit">Fahrenheit</label>
        <input type="text" id="fahrenheit" class="digits" placeholder="Fahrenheit" inputmode="decimal">
      </div>
      <div class="field">
        <label for="celsius">Celsius</label>
        <input type="text" id="celsius" class="digits" placeholder="Celsius" inputmode="decimal">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="feetInches">Feet / Inches</label>
        <input type="text" id="feetInches" class="digits" placeholder="z. B. 5'9&quot;">
        <div class="hint">Formate: 5'9", 5' 9, 5 9, 5,9</div>
      </div>
      <div class="field">
        <label for="cm">cm oder m/cm</label>
        <input type="text" id="cm" class="digits" placeholder="cm oder m/cm" inputmode="decimal">
        <div class="hint">z. B. 175 oder 1,75</div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="miles">Miles</label>
        <input type="text" id="miles" class="digits" placeholder="Meilen" inputmode="decimal">
      </div>
      <div class="field">
        <label for="km">km</label>
        <input type="text" id="km" class="digits" placeholder="km" inputmode="decimal">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="lbs">lbs</label>
        <input type="text" id="lbs" class="digits" placeholder="lbs" inputmode="decimal">
      </div>
      <div class="field">
        <label for="kg">kg</label>
        <input type="text" id="kg" class="digits" placeholder="kg" inputmode="decimal">
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
